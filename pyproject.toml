[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-ai-os"
version = "0.2.0"
description = "Multi-agent AI operating system — 200+ specialized agents"
requires-python = ">=3.11"
license = { text = "Proprietary" }
readme = "README.md"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    # Web search
    "duckduckgo-search>=6.1.7",
    # Semantic search
    "scikit-learn>=1.5.0",
    # Web UI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
]
pdf = ["pymupdf>=1.24.0"]
audio = ["openai-whisper>=20231117"]
chromadb = ["chromadb>=0.5.0"]

[project.scripts]
sovereign = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["sovereign"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".claude/worktrees", "backups"]

[tool.ruff.lint]
ignore = ["F821"]  # forward-reference string annotations; handled by type: ignore

[tool.ruff.lint.per-file-ignores]
# optional heavy dependencies loaded at runtime inside try/except
"sovereign/hud/*.py" = ["F401"]
"sovereign/perception/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["sovereign"]
omit = ["tests/*", "sovereign/*/migrations/*"]
