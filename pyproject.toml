[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sovereign-ai-os"
version = "0.3.0"
description = "SOVEREIGN AI OS — 280+ specialized agents, 41 connectors, 23 labs, FastAPI web UI"
requires-python = ">=3.11"
license = { text = "Proprietary" }
readme = "README.md"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "typer>=0.12.3",
    "aiofiles>=23.2.1",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "tenacity>=8.3.0",
    "networkx>=3.3",
    "numpy>=1.26.0",
    # Web search
    "duckduckgo-search>=6.1.7",
    # Semantic search
    "scikit-learn>=1.5.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Encryption (vault + secrets)
    "cryptography>=42.0.0",
    # Web UI
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
]

[project.optional-dependencies]
vector = ["chromadb>=0.5.0", "sentence-transformers>=3.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.4",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.12",
    "pyinstaller>=6.0.0",
]
pdf = ["pymupdf>=1.24.0"]
audio = ["openai-whisper>=20231117"]
chromadb = ["chromadb>=0.5.0"]
# Dense vector embeddings for semantic search (greatly improves memory search quality)
embeddings = ["sentence-transformers>=3.0.0"]
# Local computer control: screenshots, mouse/keyboard, OCR, template matching
computer-use = [
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
]
# All optional heavy deps
full = [
    "pymupdf>=1.24.0",
    "sentence-transformers>=3.0.0",
    "chromadb>=0.5.0",
    "mss>=9.0",
    "pyautogui>=0.9.54",
    "pytesseract>=0.3.10",
    "opencv-python-headless>=4.9",
    "Pillow>=10.0",
]

[project.scripts]
sovereign = "main:app"

[tool.hatch.build.targets.wheel]
packages = ["sovereign"]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".claude/worktrees", "backups"]

[tool.ruff.lint]
ignore = ["F821"]  # forward-reference string annotations; handled by type: ignore

[tool.ruff.lint.per-file-ignores]
# optional heavy dependencies loaded at runtime inside try/except
"sovereign/hud/*.py" = ["F401"]
"sovereign/perception/*.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=sovereign --cov-fail-under=70 -q"

[tool.coverage.run]
source = ["sovereign"]
omit = ["tests/*", "sovereign/*/migrations/*"]

[tool.coverage.report]
fail_under = 70
show_missing = false
