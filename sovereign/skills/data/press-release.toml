[skill]
id = "press-release"
name = "Press Release Writer"
description = "Write a professional PR-style press release for a product launch or announcement"
category = "marketing"
version = "1.0"
tags = ["pr", "marketing", "writing", "launch"]

[inputs]
headline = {type = "string", required = true, description = "Main announcement headline"}
company = {type = "string", required = false, description = "Company or brand name"}
announcement = {type = "string", required = true, description = "What is being announced"}
quote_person = {type = "string", required = false, description = "Name and title of person to quote"}
audience = {type = "string", required = false, description = "Target audience or market"}

[outputs]
headline = {type = "string"}
subheadline = {type = "string"}
body = {type = "string"}
quote = {type = "string"}
boilerplate = {type = "string"}

[prompt]
template = """
Write a professional press release for: {{company}}
Headline: {{headline}}
Announcement: {{announcement}}
Quote from: {{quote_person}}
Audience: {{audience}}

Format: Headline, dateline, opening paragraph (5Ws), body, executive quote, boilerplate. AP style.
"""
