[skill]
id = "risk-assessment"
name = "Risk Assessment Matrix"
description = "Build a structured risk assessment with likelihood, impact, and mitigation"
category = "governance"
version = "1.0"
tags = ["risk", "governance", "compliance", "analysis"]

[inputs]
project = {type = "string", required = true, description = "Project or initiative to assess"}
domain = {type = "string", required = false, description = "Domain: technical, financial, legal, operational, reputational"}
context = {type = "string", required = false, description = "Additional context or constraints"}
existing_controls = {type = "string", required = false, description = "Controls already in place"}

[outputs]
risks = {type = "list"}
risk_matrix = {type = "string"}
mitigations = {type = "list"}
residual_risk = {type = "string"}
overall_rating = {type = "string"}

[prompt]
template = """
Perform a risk assessment for: {{project}}
Domain: {{domain}} | Existing controls: {{existing_controls}}
Context: {{context}}

Produce: 5-8 risks with likelihood (1-5), impact (1-5), score, owner, mitigation, residual risk. Include overall risk rating.
"""
