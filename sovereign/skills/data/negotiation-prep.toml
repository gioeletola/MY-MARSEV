[skill]
id = "negotiation-prep"
name = "Negotiation Preparation"
description = "Prepare a comprehensive negotiation strategy with BATNA, anchors, and tactics"
category = "business"
version = "1.0"
tags = ["negotiation", "business", "strategy", "deals"]

[inputs]
deal = {type = "string", required = true, description = "What is being negotiated"}
your_position = {type = "string", required = false, description = "Your opening position or ideal outcome"}
their_position = {type = "string", required = false, description = "Their likely position or interests"}
context = {type = "string", required = false, description = "Relationship context, power dynamics"}

[outputs]
batna = {type = "string"}
anchor_strategy = {type = "string"}
concessions = {type = "list"}
red_lines = {type = "list"}
tactics = {type = "list"}
questions_to_ask = {type = "list"}

[prompt]
template = """
Prepare negotiation strategy for: {{deal}}
Your position: {{your_position}} | Their position: {{their_position}}
Context: {{context}}

Produce: BATNA, opening anchor with rationale, ordered concessions you can make, non-negotiable red lines, 3 tactical approaches, 5 power questions to ask them.
"""
