[skill]
id = "knowledge-extract"
name = "Knowledge Extract"
description = "Extracts key insights, concepts and atomic notes from text (articles, books, transcripts)."
version = "1.0.0"
status = "active"
permissions = ["read", "write"]
tools = ["memory_tool", "web_search"]
agents = ["knowledge_capture", "knowledge_synthesis"]
tags = ["second-brain", "learning", "knowledge", "research"]
author = "system"
requires_approval = false
enabled = true

[[inputs]]
name = "content"
type = "string"
description = "Text content to extract knowledge from"
required = true

[[inputs]]
name = "source"
type = "string"
description = "Source title or URL"
required = false
default = ""

[[inputs]]
name = "context"
type = "string"
description = "Why this is being processed (project, topic)"
required = false
default = ""

[[outputs]]
name = "key_insights"
type = "list"
description = "Atomic key insights extracted"

[[outputs]]
name = "concepts"
type = "list"
description = "Core concepts identified"

[[outputs]]
name = "action_items"
type = "list"
description = "Actionable items derived"

[[outputs]]
name = "atomic_notes"
type = "string"
description = "Progressive summarization output"

[prompt]
template = """Extract structured knowledge from this content.

Source: {{source}}
Context: {{context}}

Content:
{{content}}

Produce:
## Key Insights (atomic, 1 per bullet)
## Core Concepts
## Connections to Existing Knowledge
## Action Items (if any)
## One-sentence Summary

Apply progressive summarization: highlight the most important 20%."""
