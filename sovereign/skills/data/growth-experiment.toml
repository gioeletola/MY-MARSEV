[skill]
id = "growth-experiment"
name = "Growth Experiment Designer"
description = "Design a structured A/B or growth experiment with hypothesis and metrics"
category = "growth"
version = "1.0"
tags = ["growth", "experimentation", "product"]

[inputs]
goal = {type = "string", required = true, description = "Metric to improve"}
current_value = {type = "string", required = false}
audience_size = {type = "string", required = false}
constraints = {type = "string", required = false}

[outputs]
hypothesis = {type = "string"}
variants = {type = "list"}
primary_metric = {type = "string"}
sample_size = {type = "string"}
duration = {type = "string"}

[prompt]
template = """
Design a growth experiment to improve: {{goal}} (currently {{current_value}})
Audience: {{audience_size}} | Constraints: {{constraints}}

Output: hypothesis, control vs variant, primary metric, required sample size, run duration, success threshold.
"""
