id = "executive-summary"
name = "Executive Summary"
description = "Distil long documents or complex topics into crisp executive summaries."
category = "communication"
tags = ["writing", "summary", "executive", "communication", "report"]
model = "claude-sonnet-4-6"
requires_review = false
confidence = 0.91
version = "1.0"

[[inputs]]
name = "content"
type = "string"
description = "Document, report, or topic to summarise"
required = true

[[inputs]]
name = "audience"
type = "string"
description = "Target audience: board, investors, CEO, team, client"
required = false
default = "executive team"

[[inputs]]
name = "max_words"
type = "integer"
description = "Maximum word count for the summary"
required = false
default = 300

[[inputs]]
name = "focus"
type = "string"
description = "What to emphasise: financial impact, risks, opportunities, decisions needed"
required = false
default = "key findings, recommendations, next steps"

[[outputs]]
name = "executive_summary"
type = "string"
description = "Polished executive summary"

[[outputs]]
name = "key_decisions"
type = "string"
description = "Decisions or actions required from leadership"

system_prompt = """You are a top-tier management consultant and business writer.
Write executive summaries that:
- Lead with the most important conclusion (pyramid principle)
- Are scannable: short paragraphs, clear headers
- Quantify impact (£/$, %, time) wherever possible
- Separate facts from recommendations
- Make the ask explicit (what decision is needed?)
Never pad with background that executives already know."""

user_prompt = """Content to Summarise:
{{content}}

Audience: {{audience}}
Max words: {{max_words}}
Focus areas: {{focus}}

Write a crisp executive summary."""
