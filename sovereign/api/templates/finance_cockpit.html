<!DOCTYPE html>
<html lang="en" x-data="finance()" x-init="init()">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOVEREIGN — Finance Cockpit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { bg:'#0a0a0f', surface:'#11111a', border:'#1e1e2e',
                  cyan:'#06b6d4', violet:'#7c3aed', rose:'#f43f5e',
                  amber:'#f59e0b', emerald:'#10b981', muted:'#6b7280' },
        fontFamily: { sans:['Inter','sans-serif'], mono:['JetBrains Mono','monospace'] }
      }}
    }
  </script>
  <style>
    body { background:#0a0a0f; color:#e2e8f0; font-family:'Inter',sans-serif; }
    ::-webkit-scrollbar { width:4px; } ::-webkit-scrollbar-thumb { background:#1e1e2e; border-radius:2px; }
    .card { background:#11111a; border:1px solid #1e1e2e; border-radius:12px; }
    .gradient-border {
      background:linear-gradient(#11111a,#11111a) padding-box,
                 linear-gradient(135deg,#06b6d4,#7c3aed) border-box;
      border:1px solid transparent; border-radius:12px;
    }
    .bar-track { height:8px; background:#1e1e2e; border-radius:4px; overflow:hidden; }
    .bar-fill  { height:100%; border-radius:4px; transition:width 1s ease; }
    .cashflow-positive { color:#10b981; }
    .cashflow-negative { color:#f43f5e; }
    .sparkline path { fill:none; stroke-width:1.5; stroke-linecap:round; }
    .agent-card { transition:background 0.2s; }
    .agent-card:hover { background:#16161e; }
  </style>
</head>
<body class="min-h-screen p-4">

<!-- Nav -->
<header class="flex items-center justify-between mb-6 px-2">
  <div class="flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg gradient-border flex items-center justify-center text-amber font-mono font-bold text-sm">$</div>
    <span class="font-semibold tracking-wide">SOVEREIGN AI OS</span>
    <span class="text-xs text-muted font-mono px-2 py-0.5 rounded bg-surface border border-border">FINANCE COCKPIT</span>
  </div>
  <div class="flex items-center gap-4">
    <span class="text-xs text-muted font-mono" x-text="clock"></span>
    <button @click="runAnalysis()" class="text-xs px-3 py-1.5 rounded-lg bg-amber/10 text-amber border border-amber/20 hover:bg-amber/20 transition-colors font-medium">
      Run Analysis
    </button>
    <a href="/" class="text-xs text-muted hover:text-cyan transition-colors">← Chat</a>
  </div>
</header>

<!-- Top KPIs -->
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
  <template x-for="kpi in kpis" :key="kpi.label">
    <div class="card p-4">
      <div class="text-xs text-muted mb-1" x-text="kpi.label"></div>
      <div class="text-2xl font-bold font-mono" :class="kpi.color" x-text="kpi.value"></div>
      <div class="flex items-center gap-1 mt-1">
        <span class="text-xs" :class="kpi.trend >= 0 ? 'text-emerald' : 'text-rose'"
              x-text="(kpi.trend >= 0 ? '↑' : '↓') + Math.abs(kpi.trend) + '%'"></span>
        <span class="text-xs text-muted">MoM</span>
      </div>
    </div>
  </template>
</div>

<!-- Main Grid -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

  <!-- Cashflow Chart -->
  <div class="card p-4 lg:col-span-2">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-sm font-semibold text-muted uppercase tracking-wider">Monthly Cashflow</h2>
      <div class="flex gap-2">
        <button @click="cashflowPeriod='3m'" class="text-xs px-2 py-1 rounded transition-colors"
                :class="cashflowPeriod==='3m' ? 'bg-cyan/10 text-cyan' : 'text-muted hover:text-cyan'">3M</button>
        <button @click="cashflowPeriod='6m'" class="text-xs px-2 py-1 rounded transition-colors"
                :class="cashflowPeriod==='6m' ? 'bg-cyan/10 text-cyan' : 'text-muted hover:text-cyan'">6M</button>
        <button @click="cashflowPeriod='1y'" class="text-xs px-2 py-1 rounded transition-colors"
                :class="cashflowPeriod==='1y' ? 'bg-cyan/10 text-cyan' : 'text-muted hover:text-cyan'">1Y</button>
      </div>
    </div>
    <!-- Inline SVG bar chart -->
    <svg :viewBox="`0 0 ${cashflowBars.length * 36} 80`" class="w-full" height="80">
      <template x-for="(bar, i) in cashflowBars" :key="i">
        <g :transform="`translate(${i * 36 + 4}, 0)`">
          <rect :x="4" :y="80 - bar.h" :width="26" :height="bar.h" :fill="bar.v >= 0 ? '#10b981' : '#f43f5e'" rx="3" opacity="0.8"/>
          <text x="17" y="76" text-anchor="middle" font-size="7" fill="#6b7280" x-text="bar.label"></text>
        </g>
      </template>
    </svg>
  </div>

  <!-- Budget Burn -->
  <div class="card p-4">
    <h2 class="text-sm font-semibold text-muted uppercase tracking-wider mb-4">Budget Burn</h2>
    <div class="space-y-4">
      <template x-for="b in budgetItems" :key="b.label">
        <div>
          <div class="flex justify-between text-xs mb-1.5">
            <span class="text-gray-300" x-text="b.label"></span>
            <span class="font-mono" :class="b.pct > 85 ? 'text-rose' : b.pct > 65 ? 'text-amber' : 'text-emerald'"
                  x-text="b.pct + '%'"></span>
          </div>
          <div class="bar-track">
            <div class="bar-fill" :style="`width:${b.pct}%`"
                 :class="b.pct > 85 ? 'bg-rose' : b.pct > 65 ? 'bg-amber' : 'bg-emerald'"></div>
          </div>
          <div class="flex justify-between text-xs mt-1 text-muted font-mono">
            <span x-text="'$' + b.spent.toLocaleString()"></span>
            <span x-text="'/ $' + b.total.toLocaleString()"></span>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Finance Agents -->
  <div class="card p-4">
    <h2 class="text-sm font-semibold text-muted uppercase tracking-wider mb-4">Finance Agents</h2>
    <div class="space-y-1.5 max-h-60 overflow-y-auto">
      <template x-for="agent in financeAgents" :key="agent.id">
        <div class="agent-card flex items-center gap-3 px-3 py-2 rounded-lg cursor-pointer" @click="pingAgent(agent.id)">
          <div class="w-2 h-2 rounded-full flex-shrink-0"
               :class="agent.status === 'idle' ? 'bg-muted' : agent.status === 'running' ? 'bg-cyan animate-pulse' : 'bg-rose'"></div>
          <span class="text-xs text-gray-300 flex-1 truncate font-mono" x-text="agent.id"></span>
          <span class="text-xs" :class="agent.status === 'running' ? 'text-cyan' : 'text-muted'" x-text="agent.status"></span>
        </div>
      </template>
    </div>
  </div>

  <!-- Portfolio Snapshot -->
  <div class="card p-4 lg:col-span-2">
    <h2 class="text-sm font-semibold text-muted uppercase tracking-wider mb-4">Portfolio Snapshot</h2>
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <template x-for="asset in portfolio" :key="asset.label">
        <div class="bg-surface rounded-lg p-3 border border-border">
          <div class="text-xs text-muted mb-1" x-text="asset.label"></div>
          <div class="text-lg font-bold font-mono text-white" x-text="asset.value"></div>
          <div class="text-xs mt-0.5" :class="asset.chg >= 0 ? 'text-emerald' : 'text-rose'"
               x-text="(asset.chg >= 0 ? '+' : '') + asset.chg + '%'"></div>
        </div>
      </template>
    </div>
  </div>

</div>

<!-- Analysis Output -->
<div x-show="analysisOutput" class="card p-4 mt-4" x-transition>
  <div class="flex items-center justify-between mb-3">
    <h2 class="text-sm font-semibold text-muted uppercase tracking-wider">AI Analysis</h2>
    <button @click="analysisOutput=''" class="text-xs text-muted hover:text-rose">✕ Dismiss</button>
  </div>
  <p class="text-xs text-gray-300 leading-relaxed font-mono whitespace-pre-wrap" x-text="analysisOutput"></p>
</div>

<script>
function finance() {
  return {
    clock: '',
    ws: null,
    cashflowPeriod: '6m',
    analysisOutput: '',
    kpis: [
      {label:'Net Worth',       value:'—',   color:'text-cyan',    trend:0},
      {label:'Monthly CF',      value:'—',   color:'text-emerald', trend:0},
      {label:'Burn Rate',       value:'—',   color:'text-amber',   trend:0},
      {label:'Savings Rate',    value:'—',   color:'text-violet',  trend:0},
    ],
    cashflowBars: [],
    budgetItems: [
      {label:'Operations',   pct:62, spent:6200,  total:10000},
      {label:'Marketing',    pct:41, spent:2050,  total:5000},
      {label:'Technology',   pct:78, spent:3900,  total:5000},
      {label:'Personnel',    pct:88, spent:52800, total:60000},
    ],
    financeAgents: [
      {id:'cashflow_analyst',    status:'idle'},
      {id:'budget_manager',      status:'idle'},
      {id:'portfolio_manager',   status:'idle'},
      {id:'investment_research', status:'idle'},
      {id:'tax_optimizer',       status:'idle'},
      {id:'risk_assessor',       status:'idle'},
      {id:'expense_tracker',     status:'idle'},
      {id:'crypto_portfolio',    status:'idle'},
    ],
    portfolio: [
      {label:'Cash & Equiv',   value:'$0',   chg:0},
      {label:'Equities',       value:'$0',   chg:0},
      {label:'Real Estate',    value:'$0',   chg:0},
      {label:'Crypto',         value:'$0',   chg:0},
      {label:'Bonds',          value:'$0',   chg:0},
      {label:'Other',          value:'$0',   chg:0},
    ],

    init() {
      this.tickClock();
      setInterval(() => this.tickClock(), 1000);
      this.fetchLiveData();
      setInterval(() => this.fetchLiveData(), 10000);
      this.connectWS();
    },
    tickClock() {
      this.clock = new Date().toLocaleTimeString('en-GB',{hour12:false});
    },
    async fetchLiveData() {
      try {
        const [sumRes, portRes, cfRes] = await Promise.all([
          fetch('/api/finance/summary'), fetch('/api/finance/portfolio'), fetch('/api/finance/cashflow?months=12'),
        ]);
        if (sumRes.ok) {
          const s = await sumRes.json();
          this.kpis[0].value = '$' + (s.net_worth || 0).toLocaleString();
          this.kpis[1].value = '$' + (s.monthly_cashflow || 0).toLocaleString();
          this.kpis[2].value = '$' + (s.monthly_expenses || 0).toLocaleString();
          this.kpis[3].value = (s.savings_rate || 0).toFixed(1) + '%';
        }
        if (portRes.ok) {
          const p = await portRes.json();
          const byClass = p.by_class || {};
          const labels = Object.keys(byClass);
          if (labels.length) {
            this.portfolio = labels.map(l => ({
              label: l.charAt(0).toUpperCase() + l.slice(1),
              value: '$' + (byClass[l]||0).toLocaleString(undefined,{maximumFractionDigits:0}),
              chg: 0,
            }));
          }
        }
        if (cfRes.ok) {
          const c = await cfRes.json();
          const bars = c.cashflow || [];
          if (bars.length) {
            const maxAbs = Math.max(...bars.map(b => Math.abs(b.cashflow)), 1);
            this.cashflowBars = bars.map(b => ({
              label: b.month.slice(5),
              v: b.cashflow,
              h: Math.max(4, Math.abs(b.cashflow) / maxAbs * 70),
            }));
          }
        }
      } catch(e) { /* silent — no live data yet */ }
    },
    buildCashflowBars() { /* superseded by fetchLiveData */ },
    connectWS() {
      const proto = location.protocol==='https:'?'wss:':'ws:';
      this.ws = new WebSocket(`${proto}//${location.host}/ws`);
      this.ws.onmessage = e => this.handleMsg(JSON.parse(e.data));
      this.ws.onclose = () => setTimeout(() => this.connectWS(), 3000);
    },
    handleMsg(msg) {
      if (msg.type === 'agent_status') {
        const a = this.financeAgents.find(x => x.id === msg.agent_id);
        if (a) a.status = msg.status;
      }
      if (msg.type === 'memory_data' && msg.domain === 'financial') {
        const d = msg.data || {};
        if (d.net_worth)       this.kpis[0].value = '$' + Number(d.net_worth).toLocaleString();
        if (d.monthly_cashflow) this.kpis[1].value = '$' + Number(d.monthly_cashflow).toLocaleString();
      }
      if (msg.type === 'stream_delta') this.analysisOutput += msg.content;
      if (msg.type === 'stream_done') { /* done */ }
    },
    runAnalysis() {
      this.analysisOutput = '';
      if (this.ws && this.ws.readyState === 1)
        this.ws.send(JSON.stringify({type:'chat', content:'Provide a brief financial analysis and key recommendations.', mode:'finance'}));
    },
    pingAgent(id) {
      const a = this.financeAgents.find(x => x.id === id);
      if (a) a.status = 'running';
      setTimeout(() => { if(a) a.status = 'idle'; }, 3000);
    },
  };
}
</script>
</body>
</html>
