<!DOCTYPE html>
<html lang="en" x-data="sovereign()" x-init="init()">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SOVEREIGN AI OS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg:      '#0a0a0f',
            surface: '#11111a',
            border:  '#1e1e2e',
            cyan:    '#06b6d4',
            violet:  '#7c3aed',
            rose:    '#f43f5e',
            amber:   '#f59e0b',
            muted:   '#6b7280',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body { background: #0a0a0f; color: #e2e8f0; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #11111a; }
    ::-webkit-scrollbar-thumb { background: #1e1e2e; border-radius: 2px; }
    .gradient-border {
      background: linear-gradient(#11111a, #11111a) padding-box,
                  linear-gradient(135deg, #06b6d4, #7c3aed) border-box;
      border: 1px solid transparent;
    }
    .glow-cyan  { box-shadow: 0 0 20px rgba(6,182,212,0.15); }
    .glow-violet { box-shadow: 0 0 20px rgba(124,58,237,0.15); }
    .pulse-dot::before {
      content: ''; display: inline-block; width: 6px; height: 6px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
      animation: pulse 2s infinite;
    }
    .pulse-dot.active::before  { background: #06b6d4; }
    .pulse-dot.idle::before    { background: #6b7280; }
    .pulse-dot.error::before   { background: #f43f5e; }
    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }
    .streaming-cursor::after {
      content: '▋'; animation: blink 0.7s infinite; color: #06b6d4;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .msg-user   { background: linear-gradient(135deg, #1e1e35, #1a1a2e); border-left: 2px solid #7c3aed; }
    .msg-system { background: linear-gradient(135deg, #0d1f2d, #0a1628); border-left: 2px solid #06b6d4; }
    .msg-error  { background: linear-gradient(135deg, #2d0d0d, #1a0a0a); border-left: 2px solid #f43f5e; }
    pre, code { font-family: 'JetBrains Mono', monospace; }
    .fade-in { animation: fadeIn 0.3s ease-in; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .sidebar-item:hover { background: #1e1e2e; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="font-sans h-screen flex flex-col overflow-hidden">

<!-- Top bar -->
<header class="flex items-center justify-between px-4 py-2 border-b border-border bg-surface shrink-0">
  <div class="flex items-center gap-3">
    <div class="w-7 h-7 rounded-md bg-gradient-to-br from-cyan to-violet flex items-center justify-center text-xs font-bold text-white">S</div>
    <span class="font-semibold tracking-wide text-sm text-slate-200">SOVEREIGN AI OS</span>
    <span class="text-xs text-muted font-mono ml-2" x-text="'v0.3 · ' + mode"></span>
  </div>
  <div class="flex items-center gap-4">
    <!-- Mode selector -->
    <select x-model="selectedMode" @change="switchMode()"
            class="bg-bg border border-border rounded px-2 py-1 text-xs text-slate-300 font-mono focus:outline-none focus:border-cyan">
      <option value="command">Command</option>
      <option value="business">Business</option>
      <option value="personal">Personal</option>
      <option value="finance">Finance</option>
      <option value="research">Research</option>
      <option value="builder">Builder</option>
      <option value="study">Study</option>
      <option value="travel">Travel</option>
      <option value="local_offline">Offline</option>
      <option value="survival">Survival</option>
    </select>
    <!-- WS status -->
    <div class="flex items-center gap-1.5">
      <div :class="wsStatus === 'connected' ? 'bg-cyan' : wsStatus === 'connecting' ? 'bg-amber' : 'bg-rose'"
           class="w-2 h-2 rounded-full"></div>
      <span class="text-xs text-muted font-mono" x-text="wsStatus"></span>
    </div>
    <!-- Health -->
    <button @click="showHealth = !showHealth"
            class="text-xs text-muted hover:text-slate-300 font-mono border border-border rounded px-2 py-1">health</button>
  </div>
</header>

<!-- Main 3-column layout -->
<div class="flex flex-1 overflow-hidden">

  <!-- LEFT SIDEBAR — Sessions + Memory -->
  <aside class="w-56 border-r border-border bg-surface flex flex-col shrink-0 overflow-hidden">
    <!-- Sessions -->
    <div class="px-3 pt-3 pb-1">
      <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-2">Sessions</p>
      <template x-for="s in sessions.slice().reverse().slice(0,15)" :key="s.id">
        <div @click="loadSession(s)" :class="currentSession === s.id ? 'bg-border' : ''"
             class="sidebar-item rounded px-2 py-1.5 cursor-pointer mb-0.5 transition-colors">
          <p class="text-xs text-slate-300 truncate" x-text="s.preview || 'New session'"></p>
          <p class="text-xs text-muted font-mono" x-text="s.ts"></p>
        </div>
      </template>
      <button @click="newSession()"
              class="mt-2 w-full text-xs border border-border rounded py-1 text-muted hover:text-cyan hover:border-cyan transition-colors">
        + New session
      </button>
    </div>
    <hr class="border-border my-2"/>
    <!-- Memory domains -->
    <div class="px-3 pb-1 flex-1 overflow-y-auto">
      <div class="flex items-center justify-between mb-2">
        <p class="text-xs font-semibold text-muted uppercase tracking-widest">Memory</p>
        <button @click="fetchMemory()" class="text-xs text-muted hover:text-cyan transition-colors">↻</button>
      </div>
      <template x-for="domain in memoryDomains" :key="domain.name">
        <div @click="toggleDomain(domain)" class="sidebar-item rounded px-2 py-1.5 cursor-pointer mb-0.5 transition-colors">
          <div class="flex items-center justify-between">
            <span class="text-xs text-slate-400" x-text="domain.name"></span>
            <span class="text-xs font-mono text-muted" x-text="domain.count + ' items'"></span>
          </div>
        </div>
      </template>
    </div>
    <!-- Memory detail panel -->
    <div x-show="activeDomain" x-cloak class="border-t border-border px-3 py-2 max-h-40 overflow-y-auto bg-bg">
      <p class="text-xs text-cyan font-semibold mb-1" x-text="activeDomain?.name"></p>
      <template x-for="(val, key) in activeDomainData" :key="key">
        <div class="mb-1">
          <span class="text-xs text-muted font-mono" x-text="key + ': '"></span>
          <span class="text-xs text-slate-300 font-mono break-all" x-text="JSON.stringify(val).slice(0, 60)"></span>
        </div>
      </template>
    </div>
  </aside>

  <!-- CENTER — Chat -->
  <main class="flex-1 flex flex-col overflow-hidden">
    <!-- Messages area -->
    <div id="messages" class="flex-1 overflow-y-auto px-4 py-4 space-y-3" x-ref="messages">

      <!-- Welcome -->
      <div x-show="messages.length === 0" class="flex flex-col items-center justify-center h-full text-center">
        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-cyan to-violet flex items-center justify-center text-2xl mb-4">⚡</div>
        <h2 class="text-xl font-semibold text-slate-200 mb-2">SOVEREIGN AI OS</h2>
        <p class="text-sm text-muted max-w-md">Your total agentic operating system. 200+ agents, 14 memory domains, full executive core.</p>
        <div class="mt-6 grid grid-cols-2 gap-2 max-w-sm">
          <template x-for="prompt in quickPrompts" :key="prompt">
            <button @click="sendPrompt(prompt)"
                    class="text-xs border border-border rounded-lg px-3 py-2 text-slate-400 hover:border-cyan hover:text-cyan transition-colors text-left">
              <span x-text="prompt"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- Message bubbles -->
      <template x-for="msg in messages" :key="msg.id">
        <div :class="'fade-in ' + (msg.role === 'user' ? 'flex justify-end' : 'flex justify-start')">
          <div :class="msg.role === 'user' ? 'msg-user' : (msg.error ? 'msg-error' : 'msg-system')"
               class="max-w-3xl rounded-lg px-4 py-3 text-sm leading-relaxed">
            <!-- Agent badge -->
            <div x-show="msg.agent" class="flex items-center gap-2 mb-2">
              <div class="w-1.5 h-1.5 rounded-full bg-cyan"></div>
              <span class="text-xs font-mono text-cyan" x-text="msg.agent"></span>
              <span x-show="msg.mode" class="text-xs text-muted font-mono" x-text="'· ' + msg.mode"></span>
            </div>
            <!-- Content -->
            <div class="prose-sm text-slate-300" x-html="renderMarkdown(msg.content)"></div>
            <!-- Streaming indicator -->
            <span x-show="msg.streaming" class="streaming-cursor"></span>
            <!-- Meta -->
            <div x-show="msg.tokens || msg.confidence" class="mt-2 pt-2 border-t border-white/5 flex items-center gap-3">
              <span x-show="msg.confidence" class="text-xs font-mono text-muted"
                    x-text="'conf ' + (msg.confidence * 100).toFixed(0) + '%'"></span>
              <span x-show="msg.tokens" class="text-xs font-mono text-muted"
                    x-text="formatTokens(msg.tokens) + ' tokens'"></span>
              <span x-show="msg.mode" class="text-xs font-mono text-muted"
                    x-text="msg.mode"></span>
            </div>
          </div>
        </div>
      </template>
    </div>

    <!-- Input area -->
    <div class="shrink-0 border-t border-border bg-surface px-4 py-3">
      <!-- Tool calls feed -->
      <div x-show="activeTasks.length > 0" class="mb-2 flex flex-wrap gap-1.5">
        <template x-for="t in activeTasks" :key="t.id">
          <div class="flex items-center gap-1 bg-bg border border-border rounded-full px-2.5 py-0.5">
            <div class="w-1.5 h-1.5 rounded-full bg-cyan animate-pulse"></div>
            <span class="text-xs font-mono text-cyan" x-text="t.agent"></span>
            <span class="text-xs text-muted truncate max-w-32" x-text="t.objective"></span>
          </div>
        </template>
      </div>
      <!-- Textarea + send -->
      <div class="gradient-border rounded-xl overflow-hidden">
        <div class="flex items-end gap-2 bg-bg rounded-xl px-3 py-2">
          <textarea
            x-model="inputText"
            @keydown.enter.prevent="if (!$event.shiftKey) sendMessage()"
            @keydown.ctrl.enter.prevent="sendMessage()"
            placeholder="Ask anything… (Enter to send, Shift+Enter for newline)"
            rows="1"
            x-ref="input"
            @input="autoResize($el)"
            class="flex-1 bg-transparent text-sm text-slate-200 placeholder-muted resize-none outline-none font-mono leading-relaxed max-h-40 overflow-y-auto"
          ></textarea>
          <button @click="sendMessage()" :disabled="isStreaming || !inputText.trim()"
                  :class="isStreaming || !inputText.trim() ? 'opacity-30 cursor-not-allowed' : 'hover:shadow-lg hover:shadow-cyan/20'"
                  class="shrink-0 w-8 h-8 rounded-lg bg-gradient-to-br from-cyan to-violet flex items-center justify-center transition-all">
            <svg x-show="!isStreaming" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
            <div x-show="isStreaming" class="w-3 h-3 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
          </button>
        </div>
      </div>
      <p class="text-xs text-muted mt-1.5 text-center font-mono">
        <span x-text="mode + ' mode'"></span>
        <span class="mx-1">·</span>
        <span x-text="totalTokensFormatted + ' tokens used'"></span>
        <span class="mx-1">·</span>
        <span x-text="'$' + totalCostFormatted + ' est. cost'"></span>
      </p>
    </div>
  </main>

  <!-- RIGHT PANEL — Health + Tokens + Agents -->
  <aside class="w-64 border-l border-border bg-surface flex flex-col shrink-0 overflow-hidden">
    <!-- Health panel (toggleable) -->
    <div x-show="showHealth" class="border-b border-border">
      <div class="px-3 pt-3 pb-2">
        <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-2">System Health</p>
        <div class="flex items-center gap-2 mb-2">
          <div :class="health.overall === 'healthy' ? 'bg-cyan' : health.overall === 'degraded' ? 'bg-amber' : 'bg-rose'"
               class="w-2 h-2 rounded-full"></div>
          <span class="text-sm font-semibold text-slate-200 capitalize" x-text="health.overall || 'unknown'"></span>
        </div>
        <template x-for="(val, key) in health.checks" :key="key">
          <div class="flex items-center justify-between py-0.5">
            <span class="text-xs text-muted" x-text="key"></span>
            <span :class="val === 'ok' ? 'text-cyan' : 'text-rose'"
                  class="text-xs font-mono" x-text="val"></span>
          </div>
        </template>
      </div>
    </div>

    <!-- Token usage -->
    <div class="px-3 pt-3 pb-2 border-b border-border">
      <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-2">Token Usage</p>
      <div class="space-y-1">
        <div class="flex justify-between items-center">
          <span class="text-xs text-muted">Input</span>
          <span class="text-xs font-mono text-slate-300" x-text="formatTokens(usage.input_tokens || 0)"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-xs text-muted">Cached</span>
          <span class="text-xs font-mono text-cyan" x-text="formatTokens(usage.cache_read_input_tokens || 0)"></span>
        </div>
        <div class="flex justify-between items-center">
          <span class="text-xs text-muted">Output</span>
          <span class="text-xs font-mono text-slate-300" x-text="formatTokens(usage.output_tokens || 0)"></span>
        </div>
        <div class="h-px bg-border my-1"></div>
        <div class="flex justify-between items-center">
          <span class="text-xs text-muted font-semibold">Est. cost</span>
          <span class="text-xs font-mono text-violet" x-text="'$' + totalCostFormatted"></span>
        </div>
        <!-- Cache hit rate bar -->
        <div x-show="usage.input_tokens > 0" class="mt-2">
          <div class="flex justify-between text-xs text-muted mb-1">
            <span>Cache hit rate</span>
            <span class="text-cyan" x-text="cacheHitRate + '%'"></span>
          </div>
          <div class="h-1.5 bg-border rounded-full overflow-hidden">
            <div class="h-full bg-gradient-to-r from-cyan to-violet rounded-full transition-all"
                 :style="'width: ' + cacheHitRate + '%'"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Active agents -->
    <div class="px-3 pt-3 pb-2 flex-1 overflow-y-auto">
      <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-2">Agents</p>
      <template x-for="agent in activeAgents" :key="agent.id">
        <div class="flex items-center gap-2 py-1">
          <div :class="'pulse-dot ' + agent.status"></div>
          <span class="text-xs font-mono text-slate-300 truncate" x-text="agent.id"></span>
          <span class="text-xs text-muted ml-auto" x-text="agent.status"></span>
        </div>
      </template>
      <div x-show="activeAgents.length === 0" class="text-xs text-muted italic">
        No active agents
      </div>
    </div>

    <!-- Decision log -->
    <div class="border-t border-border px-3 py-2 max-h-40 overflow-y-auto">
      <p class="text-xs font-semibold text-muted uppercase tracking-widest mb-1.5">Decision Log</p>
      <template x-for="d in decisionLog.slice().reverse().slice(0, 8)" :key="d.id">
        <div class="py-0.5">
          <div class="flex items-start gap-1">
            <div :class="d.status === 'SUCCESS' ? 'text-cyan' : 'text-rose'" class="text-xs font-mono mt-0.5">●</div>
            <span class="text-xs text-slate-400 leading-tight" x-text="d.text"></span>
          </div>
          <span class="text-xs text-muted font-mono ml-3" x-text="d.ts"></span>
        </div>
      </template>
    </div>
  </aside>
</div>

<script>
function sovereign() {
  return {
    // State
    wsStatus:     'disconnected',
    ws:           null,
    wsReconnectDelay: 1000,
    mode:         'command',
    selectedMode: 'command',
    messages:     [],
    inputText:    '',
    isStreaming:  false,
    sessions:     [],
    currentSession: null,
    activeTasks:  [],
    activeAgents: [],
    decisionLog:  [],
    health:       {},
    showHealth:   true,
    usage:        {},
    totalCost:    0,
    memoryDomains: [],
    activeDomain:  null,
    activeDomainData: {},
    msgId:        0,
    streamingMsg: null,

    quickPrompts: [
      'Give me today\'s executive briefing',
      'What are my top 3 priorities this week?',
      'Run a financial health check',
      'What opportunities am I missing?',
      'Show my goal progress',
    ],

    get totalTokensFormatted() {
      const t = (this.usage.input_tokens || 0) + (this.usage.output_tokens || 0);
      return this.formatTokens(t);
    },
    get totalCostFormatted() {
      return this.totalCost.toFixed(4);
    },
    get cacheHitRate() {
      const inp   = (this.usage.input_tokens || 0) + (this.usage.cache_read_input_tokens || 0);
      const cached = this.usage.cache_read_input_tokens || 0;
      if (!inp) return 0;
      return Math.round((cached / inp) * 100);
    },

    init() {
      this.connect();
      this.pollHealth();
      this.memoryDomains = [
        'identity','operational','project','relationship','financial',
        'learning','inventory','health_routine','diary','legal_compliance',
        'decision','research','content','brand',
      ].map(n => ({ name: n, count: 0 }));
    },

    // WebSocket
    connect() {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      const url   = `${proto}://${location.host}/ws`;
      this.wsStatus = 'connecting';
      try {
        this.ws = new WebSocket(url);
      } catch(e) {
        this.wsStatus = 'error';
        setTimeout(() => this.reconnect(), this.wsReconnectDelay);
        return;
      }
      this.ws.onopen = () => {
        this.wsStatus = 'connected';
        this.wsReconnectDelay = 1000;
        this.sendWs({ type: 'health_poll' });
      };
      this.ws.onmessage = (ev) => {
        try { this.handleWs(JSON.parse(ev.data)); } catch(e) {}
      };
      this.ws.onclose = () => {
        this.wsStatus = 'disconnected';
        setTimeout(() => this.reconnect(), this.wsReconnectDelay);
      };
      this.ws.onerror = () => {
        this.wsStatus = 'error';
      };
    },
    reconnect() {
      this.wsReconnectDelay = Math.min(this.wsReconnectDelay * 2, 16000);
      this.connect();
    },
    sendWs(data) {
      if (this.ws && this.ws.readyState === WebSocket.OPEN)
        this.ws.send(JSON.stringify(data));
    },

    handleWs(msg) {
      switch(msg.type) {
        case 'stream_delta':
          this.handleDelta(msg);
          break;
        case 'stream_done':
          this.handleDone(msg);
          break;
        case 'agent_status':
          this.handleAgentStatus(msg);
          break;
        case 'tool_call':
          this.handleToolCall(msg);
          break;
        case 'health':
          this.health = msg.data || {};
          break;
        case 'memory_data':
          this.handleMemoryData(msg);
          break;
        case 'error':
          this.addMessage('system', msg.message, { error: true });
          this.isStreaming = false;
          break;
        case 'task_start':
          this.activeTasks.push({ id: msg.session_id + msg.agent, agent: msg.agent, objective: msg.objective });
          this.updateAgentStatus(msg.agent, 'active');
          break;
        case 'task_done':
          this.activeTasks = this.activeTasks.filter(t => t.agent !== msg.agent);
          this.updateAgentStatus(msg.agent, 'idle');
          this.addDecisionLog(msg.agent, msg.status);
          break;
      }
    },

    handleDelta(msg) {
      if (!this.streamingMsg) {
        this.streamingMsg = this.addMessage('system', '', {
          streaming: true, agent: msg.agent || 'sovereign', mode: this.mode
        });
      }
      this.streamingMsg.content += msg.text;
      this.$nextTick(() => this.scrollToBottom());
    },
    handleDone(msg) {
      if (this.streamingMsg) {
        this.streamingMsg.streaming = false;
        this.streamingMsg.confidence = msg.confidence;
        this.streamingMsg.tokens    = msg.tokens_total;
        if (msg.tokens_used) this.usage = { ...this.usage, ...msg.tokens_used };
        if (msg.cost_usd) this.totalCost += msg.cost_usd;
        this.streamingMsg = null;
      }
      this.isStreaming = false;
      this.activeTasks = [];
    },
    handleAgentStatus(msg) {
      this.updateAgentStatus(msg.agent_id, msg.status);
    },
    handleToolCall(msg) {
      this.addDecisionLog(msg.tool || 'tool', 'TOOL', msg.input_preview || '');
    },
    handleMemoryData(msg) {
      const domain = this.memoryDomains.find(d => d.name === msg.domain);
      if (domain) {
        domain.count = Object.keys(msg.data || {}).length;
        if (this.activeDomain?.name === msg.domain)
          this.activeDomainData = msg.data || {};
      }
    },

    // Messages
    addMessage(role, content, extra = {}) {
      const msg = { id: ++this.msgId, role, content, streaming: false, ...extra };
      this.messages.push(msg);
      this.$nextTick(() => this.scrollToBottom());
      return msg;
    },
    scrollToBottom() {
      const el = this.$refs.messages;
      if (el) el.scrollTop = el.scrollHeight;
    },

    // Send
    sendMessage() {
      const text = this.inputText.trim();
      if (!text || this.isStreaming) return;
      this.inputText = '';
      this.$refs.input.style.height = 'auto';
      this.addMessage('user', text);
      this.isStreaming = true;
      this.streamingMsg = null;
      this.sendWs({ type: 'chat', content: text, mode: this.selectedMode });

      // Save session
      const session = { id: Date.now(), preview: text.slice(0, 40), ts: new Date().toLocaleTimeString() };
      this.sessions.push(session);
      this.currentSession = session.id;
    },
    sendPrompt(text) { this.inputText = text; this.sendMessage(); },

    // Mode
    switchMode() {
      this.mode = this.selectedMode;
      this.sendWs({ type: 'mode_switch', mode: this.selectedMode });
      this.addDecisionLog('system', 'MODE', 'Switched to ' + this.selectedMode);
    },

    // Health polling
    pollHealth() {
      setInterval(() => {
        if (this.wsStatus === 'connected')
          this.sendWs({ type: 'health_poll' });
      }, 30000);
    },

    // Memory
    fetchMemory() {
      this.memoryDomains.forEach(d => {
        this.sendWs({ type: 'memory_fetch', domain: d.name });
      });
    },
    toggleDomain(domain) {
      if (this.activeDomain?.name === domain.name) {
        this.activeDomain = null;
        this.activeDomainData = {};
      } else {
        this.activeDomain = domain;
        this.activeDomainData = {};
        this.sendWs({ type: 'memory_fetch', domain: domain.name });
      }
    },

    // Sessions
    newSession() {
      this.messages = [];
      this.currentSession = null;
      this.activeTasks = [];
      this.streamingMsg = null;
      this.isStreaming = false;
    },
    loadSession(s) {
      this.currentSession = s.id;
    },

    // Agents
    updateAgentStatus(agentId, status) {
      const existing = this.activeAgents.find(a => a.id === agentId);
      if (existing) { existing.status = status; }
      else { this.activeAgents.push({ id: agentId, status }); }
    },

    // Decision log
    addDecisionLog(agent, status, text = '') {
      this.decisionLog.push({
        id: Date.now(),
        text: (text || agent).slice(0, 50),
        status,
        ts: new Date().toLocaleTimeString(),
      });
      if (this.decisionLog.length > 50) this.decisionLog.shift();
    },

    // Markdown renderer (minimal, no external deps)
    renderMarkdown(text) {
      if (!text) return '';
      return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/^#{3}\s(.+)$/gm, '<h3 class="text-sm font-semibold text-slate-200 mt-3 mb-1">$1</h3>')
        .replace(/^#{2}\s(.+)$/gm, '<h2 class="text-base font-semibold text-slate-100 mt-4 mb-2">$1</h2>')
        .replace(/^#{1}\s(.+)$/gm, '<h1 class="text-lg font-bold text-white mt-4 mb-2">$1</h1>')
        .replace(/\*\*(.+?)\*\*/g, '<strong class="text-slate-100 font-semibold">$1</strong>')
        .replace(/\*(.+?)\*/g, '<em class="text-slate-300">$1</em>')
        .replace(/`(.+?)`/g, '<code class="bg-border rounded px-1 py-0.5 text-cyan text-xs">$1</code>')
        .replace(/```([\s\S]*?)```/g, '<pre class="bg-bg border border-border rounded p-3 text-xs text-slate-300 overflow-x-auto my-2"><code>$1</code></pre>')
        .replace(/^- (.+)$/gm, '<li class="text-slate-300 ml-4 list-disc">$1</li>')
        .replace(/^\d+\. (.+)$/gm, '<li class="text-slate-300 ml-4 list-decimal">$1</li>')
        .replace(/\n\n/g, '</p><p class="mt-2">')
        .replace(/\n/g, '<br/>')
        .replace(/^/, '<p>').replace(/$/, '</p>');
    },

    formatTokens(n) {
      if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n/1000).toFixed(1) + 'k';
      return String(n);
    },

    autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    },
  };
}
</script>
</body>
</html>
