name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy-key-for-ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" bandit

      - name: Lint with ruff
        run: ruff check sovereign/ tests/

      - name: Type check with mypy
        run: mypy sovereign/ --ignore-missing-imports --no-strict-optional --follow-imports=silent
        continue-on-error: true

      - name: Security scan with bandit
        run: bandit -r sovereign/ -ll -x sovereign/labs/,sovereign/centers/ --format txt
        continue-on-error: true

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --cov=sovereign --cov-report=term-missing --cov-fail-under=70

      - name: Import smoke test
        run: python -c "import sovereign; print(sovereign.__version__)"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-ai-os:${{ github.sha }} .

      - name: Verify Docker health endpoint
        run: |
          docker run -d --name sovereign-test \
            -e ANTHROPIC_API_KEY=dummy-key \
            -e SOVEREIGN_PASSWORD=testpass123 \
            -e AUTH_SECRET_KEY=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            -e SECRET_MANAGER_KEY=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            -p 8080:8080 \
            sovereign-ai-os:${{ github.sha }} || true
          sleep 5
          docker logs sovereign-test 2>&1 | head -20 || true
          docker stop sovereign-test || true
          docker rm sovereign-test || true
