name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'dummy-key-for-ci' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]" bandit

      - name: Lint with ruff
        run: ruff check sovereign/ tests/

      - name: Type check with mypy
        run: mypy sovereign/ --ignore-missing-imports --no-strict-optional --follow-imports=silent
        continue-on-error: true

      - name: Security scan with bandit
        run: bandit -r sovereign/ -ll -x sovereign/labs/,sovereign/centers/ --format txt
        continue-on-error: true

      - name: Run tests
        run: python -m pytest tests/ -q --tb=short --cov=sovereign --cov-report=term-missing --cov-fail-under=60

      - name: Import smoke test
        run: python -c "import sovereign; print(sovereign.__version__)"

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sovereign-ai-os:${{ github.sha }} .
