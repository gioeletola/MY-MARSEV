name: CD

on:
  push:
    branches:
      - main

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (staging)
        run: docker build -t sovereign-ai-os:staging .

      - name: Deploy to staging
        run: echo "Deploy to staging via docker-compose up -d"

  deploy-production:
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image (production)
        run: docker build -t sovereign-ai-os:production .

      - name: Deploy to production
        run: echo "Deploy to production via docker-compose up -d"
