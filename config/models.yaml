# SOVEREIGN AI OS — Model routing configuration

models:
  frontier:
    id: claude-opus-4-6
    description: "Highest capability — strategic decisions, complex reasoning, sensitive tasks"
    max_tokens: 8192
    use_for:
      - strategic_planning
      - sensitive_decisions
      - complex_multi_step_reasoning
      - ceo_agent
      - decision_brief

  balanced:
    id: claude-sonnet-4-6
    description: "General purpose — coordination, guardian review, most worker tasks"
    max_tokens: 4096
    use_for:
      - general_tasks
      - coordination
      - guardian_review
      - chief_of_staff
      - worker_agents

  fast:
    id: claude-haiku-4-5-20251001
    description: "Cheapest/fastest — ephemeral agents, classification, simple queries"
    max_tokens: 2048
    use_for:
      - ephemeral_agents
      - simple_classification
      - bulk_operations
      - routing_decisions

  # ── Qwen (local, privacy-safe) ──────────────────────────────────────
  qwen_fast:
    id: qwen2.5:7b
    provider: qwen
    description: "Fast local Qwen 2.5 7B — low VRAM, privacy-safe"
    max_tokens: 8192
    privacy_safe: true
    use_for:
      - offline_mode
      - privacy_sensitive
      - local_first_tasks

  qwen_balanced:
    id: qwen2.5:14b
    provider: qwen
    description: "Balanced local Qwen 2.5 14B — solid capability, privacy-safe"
    max_tokens: 16384
    privacy_safe: true
    use_for:
      - offline_mode
      - local_reasoning
      - code_tasks

  qwen_frontier:
    id: qwen3:32b
    provider: qwen
    description: "High-capability local Qwen 3 32B — near-frontier, privacy-safe"
    max_tokens: 32768
    privacy_safe: true
    use_for:
      - complex_local_tasks
      - frontier_offline

  qwen_coder:
    id: qwen2.5-coder:14b
    provider: qwen
    description: "Code-specialized Qwen 2.5 Coder 14B"
    max_tokens: 16384
    privacy_safe: true
    use_for:
      - code_generation
      - code_review
      - debugging

routing_rules:
  - if:
      complexity_above: 0.8
    use: frontier
  - if:
      is_sensitive: true
    use: frontier
  - if:
      latency_budget_ms_below: 2000
    use: fast
  - if:
      action_class: READ
    use: fast
  - default: balanced
